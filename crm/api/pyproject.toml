[tool.poetry]
name = "copiloto-imobiliario"
version = "0.1.0"
description = "Sistema multi-agente de análise de conversas para imobiliárias"
authors = ["agencia <contato@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
agno = ">=2.5.0"
anthropic = ">=0.40.0"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.0"}
alembic = ">=1.13.0"
psycopg = {extras = ["binary"], version = ">=3.1.0"}
pydantic-settings = ">=2.0.0"
structlog = ">=24.0.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.27.0"
tenacity = "^9.1.4"
gspread = ">=6.2.1"
google-auth = ">=2.52.0"
google-genai = ">=2.0.0"
sentry-sdk = {extras = ["fastapi"], version = ">=2.0.0"}
# Fotos do banco de imóveis (Camada 1): redimensionamento no servidor e marca
# d'água da própria Acme. Já estava no venv por transitividade — declarado
# aqui porque agora é dependência DIRETA (app/services/imoveis_captados.py).
pillow = ">=10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
mypy = ">=1.8.0"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: testes que chamam APIs externas reais (requerem credenciais)",
    "dia_util: liga a trava de dia útil (o resto da suíte roda com ela desligada)",
]
# Testes @integration batem em serviços REAIS (Kommo, Evolution, Gemini, CLI) —
# fora do run default pra suíte ser verde/determinística sem rede/credencial.
# Rodar manualmente: pytest tests/ -m integration
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
