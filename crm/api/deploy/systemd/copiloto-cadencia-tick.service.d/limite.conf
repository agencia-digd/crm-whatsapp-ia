# Drop-in PROPOSTO pro tick que dispara o remarketing (05/10/2026). NÃO está
# instalado — instalar é publicação, com OK da Dona (comando no
# projetos/crm/GARANTIA-REMARKETING.md).
#
# A unit instalada tem TimeoutStartUSec=infinity: uma volta travada (rede
# presa, banco preso) nunca termina, e como a unit é oneshot a volta seguinte
# NÃO começa — o disparo para calado até alguém reiniciar. Com limite, a volta
# presa é morta e a próxima roda em 3 minutos.
#
# 10 minutos: uma volta normal leva segundos; a pior volta legítima (3 leads,
# rotação de templates, 20 s de timeout por tentativa) fica abaixo disso.
# Morrer no meio de um envio deixa a RESERVA do lead (ele não volta pra fila,
# não recebe duas vezes) e o conferente fecha a conta.
[Service]
TimeoutStartSec=600
