server {
    server_name app.example.com;

    # ── Copiloto Painel (Sub-onda 10.4) ────────────────────────────
    # API: proxy pro copiloto-api porta 8002, injeta X-Painel-User.
    # Precede /painel/ por ser prefix mais longo (longest-match no nginx).
    location /painel/api/ {
        auth_basic "Copiloto Acme";
        auth_basic_user_file /etc/nginx/painel.htpasswd;
        proxy_pass http://127.0.0.1:8002/painel/;
        proxy_set_header X-Painel-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # Webhook Telegram bot @copiloto_acme_bot → copiloto-api.
    # Path tem secret embutido pra evitar requests não-autorizados (a Telegram
    # também valida via secret_token mas defesa em profundidade).
    location /copiloto/telegram/ {
        proxy_pass http://127.0.0.1:8002/api/telegram/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /painel sem barra → redireciona pra /painel/
    location = /painel { return 301 /painel/; }

    # Estático SPA: dist/ do build Vite com fallback pro index.html.
    location /painel/ {
        alias /var/www/copiloto-painel/;
        try_files $uri $uri/ /painel/index.html;
        auth_basic "Copiloto Acme";
        auth_basic_user_file /etc/nginx/painel.htpasswd;

        # Assets têm hash no nome (index-XXXX.js) — cachear forever.
        location ~* /painel/assets/.*\.(js|css|woff2?|png|jpg|svg)$ {
            alias /var/www/copiloto-painel/assets/;
            auth_basic "Copiloto Acme";
            auth_basic_user_file /etc/nginx/painel.htpasswd;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # index.html NUNCA cacheia — força browser a ver versão nova após deploy.
    location = /painel/index.html {
        alias /var/www/copiloto-painel/index.html;
        auth_basic "Copiloto Acme";
        auth_basic_user_file /etc/nginx/painel.htpasswd;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name app.example.com;

    listen 80;
    return 404; # managed by Certbot


}