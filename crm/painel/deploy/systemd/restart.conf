# O painel caiu sozinho em 26/08/2026 às 16h10 com status=0/SUCCESS — saída
# LIMPA, não falha. Com Restart=on-failure o systemd não reergue nesse caso, e
# o serviço ficou morto até a Dona tentar salvar uma anotação e tomar erro.
#
# Servidor web que sai sozinho é sempre anomalia, não importa o código de saída:
# ninguém pede pro Next "terminar com sucesso". Restart=always cobre os dois.
[Service]
Restart=always
RestartSec=5
