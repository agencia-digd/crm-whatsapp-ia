# Painel Acme V2 — v2.app.example.com → next start :3009
# DNS-only no Cloudflare (grey cloud, igual app.example.com): Universal SSL
# da CF não cobre subdomínio de 2º nível (*.app.example.com), então TLS
# termina aqui no origin com cert LE. Se um dia virar proxied (ACM/Total TLS),
# lembrar do gotcha SSL Flexible: trocar o redirect da porta 80 por proxy
# direto com auth (ver app.example.com).
#
# ── AUTENTICAÇÃO: sessão em cookie (migrado do Basic Auth em 11/08/2026) ────
# Basic Auth não tem logout — o navegador guardava a senha e reenviava sozinho,
# então "Sair / trocar conta" só recarregava a página. Agora o painel usa
# cookie de sessão assinado, emitido por /login ou pelo link mágico /entrar.
#
# O NGINX CONTINUA SENDO O PORTEIRO, via auth_request: cada requisição passa
# por /_auth → o app diz 204 (pode) ou 401 (não). Se o app cair, o nginx nega
# tudo — fail-closed. Deixar a decisão só no middleware do Next deixaria o
# painel ABERTO num erro de matcher, e aqui tem dado da imobiliária.
#
# Público: só /login e /entrar (e os arquivos do PWA). O bundle /_next/* NÃO é
# público — por isso a tela de login é <form> HTML puro, sem depender de JS.
#
# Rollback: cp da versão anterior + `nginx -t && systemctl reload nginx`.
server {
    server_name v2.app.example.com app.example.com;

    # Porteiro. `internal` = só o próprio nginx chama, nunca o navegador.
    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:3009/api/auth/verificar;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URI $request_uri;
    }

    # Tela de login — a única página sem sessão. Form HTML puro: posta em
    # /api/auth/login, que valida no htpasswd e devolve o cookie.
    location = /login {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entrada por LINK: /entrar?k=<token> → sessão pronta, sem digitar senha.
    # A corretora no celular tropeça no login (maiúscula automática no usuário,
    # gerenciador de senha atropelando o campo, navegador de dentro do WhatsApp).
    # Quem valida o token agora é o app — antes era um `map` daqui.
    location = /entrar {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do app instalado (PWA) SEM sessão. Motivo: o Safari busca o
    # ícone e o manifest sem mandar o cookie da sessão — levava 401 e o iOS
    # caía no fallback (quadrado cinza com a letra "B"). Nada aqui é dado da
    # imobiliária: é a logo pública, o manifest e o service worker.
    # CSS e fontes SEM auth. A tela de login é pública, mas o estilo dela vinha
    # de /_next/static/css/ — que caía no `location /` e levava 302 pro próprio
    # login. Resultado: a página abria em HTML cru (fonte serifada, campos
    # atropelados) e parecia que "o painel não abre no celular". Quem entra pelo
    # link mágico nunca viu, porque já chega com sessão.
    # Escopo de propósito: só `css` e `media` (fontes). `chunks` (o JavaScript
    # do painel) continua atrás do auth — o login é <form> nativo e não precisa
    # dele, que é justamente por que ele foi escrito assim.
    location ~ ^/_next/static/(css|media)/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(icon-[a-z0-9-]+\.png|apple-touch-icon[a-z-]*\.png|manifest\.webmanifest|favicon\.ico|sw\.js)$ {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request     /_auth;
        # Quem é a pessoa, dito pelo porteiro — o app inteiro lê este header.
        auth_request_set $corretor_auth_user $upstream_http_x_auth_user;
        error_page       401 = @sem_sessao;

        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header X-Auth-User $corretor_auth_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Sem sessão → login, guardando pra onde a pessoa ia.
    location @sem_sessao {
        return 302 https://$host/login?de=$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name v2.app.example.com app.example.com;
    return 301 https://$host$request_uri;


}
